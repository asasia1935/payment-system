services:
  postgres:
    image: postgres:17
    container_name: payment-postgres

    environment:
      POSTGRES_DB: payment_system
      POSTGRES_USER: payment_app
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "127.0.0.1:15432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_app -d payment_system"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: